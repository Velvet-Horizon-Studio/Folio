[package]
name = "folio"
version = "1.2.1"
description = "Folio: multi-folder image slideshow and manager"
authors = ["Velvet Horizon Studio"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order keeps config.json keys and SD parameters in their original order
serde_json = { version = "1", features = ["preserve_order"] }
rayon = "1"
sha1 = "0.10"
hex = "0.4"
filetime = "0.2"
humantime = "2"
percent-encoding = "2"
regex = "1"
notify = "8"
trash = "5"
imagesize = "0.13"
keepawake = "0.5"
clipboard-win = "5"
# Format conversion only (the renderer decodes everything else with Chromium)
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }

# Image decoding is many times slower unoptimized; optimize dependencies in dev builds too
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
